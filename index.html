<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>صورة المقلب 📸</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#35205d 0,#11111b 42%,#08080d 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(100%,430px);border:1px solid #ffffff18;background:#11111bdd;backdrop-filter:blur(18px);border-radius:28px;padding:24px;box-shadow:0 24px 80px #0008}
.logo{width:68px;height:68px;margin:auto;border-radius:22px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 10px 35px #7c3aed55}
h1{text-align:center;font-size:27px;margin:18px 0 8px}
.sub{text-align:center;color:#b7b7c5;line-height:1.7;margin:0 0 20px}
.notice{background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:13px;color:#c8c8d2;font-size:13px;line-height:1.7;margin-bottom:16px}
.camera{display:none;position:relative;overflow:hidden;border-radius:22px;background:#050509;aspect-ratio:3/4;margin-bottom:15px}
video{width:100%;height:100%;object-fit:cover}
.status{position:absolute;top:12px;right:12px;background:#0009;border:1px solid #fff1;padding:7px 10px;border-radius:999px;font-size:12px}
button{width:100%;border:0;border-radius:17px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 12px 30px #7c3aed44}
button:active{transform:scale(.98)}
#capture{display:none}
.msg{text-align:center;min-height:24px;color:#aaaabd;font-size:14px;margin-top:13px}
.success{display:none;text-align:center;padding:20px 5px}
.check{width:86px;height:86px;border-radius:50%;background:#20c77a;display:grid;place-items:center;font-size:48px;margin:0 auto 20px;box-shadow:0 15px 45px #20c77a33}
.success h2{font-size:30px;margin:0 0 10px}
.success p{color:#bdbdca;line-height:1.8;margin:0}
small{display:block;text-align:center;color:#666878;margin-top:17px}
</style>
</head>
<body>
<div class="card">
  <section id="main">
    <div class="logo">📸</div>
    <h1>صورة المقلب 😂</h1>
    <p class="sub">افتح الكاميرا والتقط صورة بنفسك.<br>المقلب هيظهر بعد التصوير.</p>

    <div class="notice">
      🔒 المتصفح سيطلب إذن الكاميرا أولاً.<br>
      لن يتم التقاط أو إرسال أي صورة إلا بعد موافقتك والضغط على زر التصوير.
    </div>

    <div class="camera" id="cameraBox">
      <video id="video" autoplay playsinline></video>
      <div class="status">● الكاميرا تعمل</div>
    </div>

    <button id="start">فتح الكاميرا 📷</button>
    <button id="capture">التقاط الصورة</button>
    <div class="msg" id="msg"></div>
    <small>تحتاج الصفحة إلى HTTPS لاستخدام الكاميرا.</small>
  </section>

  <section class="success" id="success">
    <div class="check">✓</div>
    <h2>اتصورت! 😂</h2>
    <p>وقعت في المقلب 😄<br>تم إرسال الصورة بنجاح.</p>
  </section>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const startBtn=document.getElementById("start");
const captureBtn=document.getElementById("capture");
const cameraBox=document.getElementById("cameraBox");
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const msg=document.getElementById("msg");
const main=document.getElementById("main");
const success=document.getElementById("success");
let stream=null;

startBtn.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1080},height:{ideal:1440}},
      audio:false
    });
    video.srcObject=stream;
    cameraBox.style.display="block";
    startBtn.style.display="none";
    captureBtn.style.display="block";
    msg.textContent="جاهز للتصوير 📸";
  }catch(e){
    msg.textContent="لم يتم السماح باستخدام الكاميرا.";
  }
};

captureBtn.onclick=()=>{
  if(!stream)return;
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);

  captureBtn.disabled=true;
  msg.textContent="جاري إرسال الصورة...";

  canvas.toBlob(async blob=>{
    try{
      const fd=new FormData();
      fd.append("photo",blob,"camera-photo.jpg");
      const r=await fetch("/upload",{method:"POST",body:fd});
      if(!r.ok)throw new Error();
      stream.getTracks().forEach(t=>t.stop());
      main.style.display="none";
      success.style.display="block";
    }catch(e){
      captureBtn.disabled=false;
      msg.textContent="حصل خطأ أثناء إرسال الصورة.";
    }
  },"image/jpeg",0.9);
};
</script>
</body>
</html>
